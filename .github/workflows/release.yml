name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PILOTBOAT_VERSION="$VERSION" PILOTBOAT_UNIVERSAL=1 Scripts/bundle.sh release
          ditto -c -k --keepParent .build/Pilotboat.app "Pilotboat-$VERSION.zip"
          echo "SHA=$(shasum -a 256 "Pilotboat-$VERSION.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Pilotboat-$VERSION.zip" --generate-notes --verify-tag
      - name: Update tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/cure-tmk/homebrew-tap.git" tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/pilotboat.rb
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -am "pilotboat $VERSION"
          git push
